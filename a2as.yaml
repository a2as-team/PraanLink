  report_builder_root_agent:
    type: instance
    params:
      name: report_builder_root_agent
      description: Unified patient health report generator that consolidates all available structured data (call transcripts,
        lab reports, prescriptions) into a comprehensive, chronological, clinically meaningful report. Processes data with
        date-based weighting, prioritizing recent information and analyzing trends across time.
