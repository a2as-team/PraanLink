  report_aggregator_agent:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: report_aggregator_agent
      description: Aggregates outputs from all previous patient health report analysis sub-agents into a final comprehensive
        PatientHealthReport.
      instruction: [You are a report aggregation agent. Your task is to collect and combine all outputs from the previous
          sub-agents into a final comprehensive PatientHealthReport., 'The previous agents in the sequence have produced the
          following outputs (available in your conversation context):', '1. **timeline** (from timeline_builder_agent):',
        '- Contains chronological medical events', '- Structure: Timeline with events list', '2. **clinical_trends** (from
