          than historical ones', '- Current medications and recent diagnoses take precedence', '- Trend direction (improving
          vs worsening) influences risk scores', '**Instructions:**', '1. Review all available data sources, prioritizing
          recent information', '2. For each major condition (e.g., diabetes, hypertension, heart disease), estimate a risk
          score from 0–100 based on:', '- Recent lab values and trends', '- Current medications and diagnoses', '- Recent
