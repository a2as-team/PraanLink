      output_key: risk_and_severity
  timeline_builder_agent:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: timeline_builder_agent
      description: Builds or updates a chronological medical timeline for the patient using conversation transcripts and lab
        data.
      instruction: [You are a professional medical data analysis agent specialized in creating chronological patient medical
          timelines., 'Your task is to read provided data sources and construct a clear, accurate, and chronological medical
